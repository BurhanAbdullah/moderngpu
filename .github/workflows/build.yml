name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  configure-build:
    name: CMake configure / build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        demos: [OFF, ON]
        tutorials: [OFF, ON]
        exclude:
          - build_type: Debug
            demos: ON
            tutorials: ON
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Check CUDA toolchain
        run: |
          nvcc --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMODERNGPU_BUILD_DEMO=${{ matrix.demos }} \
            -DMODERNGPU_BUILD_TUTORIAL=${{ matrix.tutorials }} \
            -DMODERNGPU_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test binaries
        if: matrix.build_type == 'Release' && matrix.demos == 'OFF' && matrix.tutorials == 'OFF'
        run: |
          test -d build/bin
          find build/bin -maxdepth 1 -type f -perm -111 -print