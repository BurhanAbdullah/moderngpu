# ModernGPU Windows CUDA build workflow
name: Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Fetch CUDA toolkit
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with:
          cuda: '13.1.0'

      - name: Check nvcc version
        run: nvcc -V

      - uses: actions/checkout@v6

      # Use Ninja rather than the default Visual Studio generator.
      # This avoids CMake's Visual Studio CUDA-toolset discovery path,
      # which is not reliable on the current Windows runner image.
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH/bin/nvcc.exe" `
            -DCMAKE_CUDA_ARCHITECTURES=75 `
            -DMODERNGPU_CUDA_ARCHITECTURES=75 `
            -DMODERNGPU_BUILD_DEMO=OFF `
            -DMODERNGPU_BUILD_TUTORIAL=OFF `
            -DMODERNGPU_BUILD_TESTS=ON

      - name: Build all applications
        run: cmake --build ${{ github.workspace }}/build --parallel
